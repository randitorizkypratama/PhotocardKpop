name: Pocamarket Daily Sync

on:
  schedule:
    # Every day at 17:00 UTC (= 00:00 WIB)
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-pocamarket
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Chromium for Playwright
        run: bun run --cwd apps/kpop-tracker npx playwright install --with-deps chromium

      - name: Run Pocamarket Sync
        working-directory: apps/kpop-tracker
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/sync-pocamarket.mjs
