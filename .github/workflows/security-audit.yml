name: Security audit

on:
  schedule:
    # 1st of every month, 06:00 UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Audit dependencies
        run: bun audit
