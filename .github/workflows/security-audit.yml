name: Security audit

on:
  schedule:
    # 1st of every month, 06:00 UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Audit dependencies
        # braces (GHSA-vfj7-8cjw-p6xm, CVE-2026-93687) and node-forge
        # (GHSA-86w9-cpqp-85rv, CVE-2026-85393) both report "Patched
        # versions: None" - upstream has not shipped a fix yet. `bun audit fix`
        # still repairs everything fixable inside the declared ranges and exits
        # non-zero when a NEW advisory appears, so drop an --ignore as soon as
        # the corresponding release lands.
        run: bun audit fix --ignore GHSA-vfj7-8cjw-p6xm --ignore GHSA-86w9-cpqp-85rv
