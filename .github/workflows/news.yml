name: News Verification Run

# Triggers the news pipeline on the deployed app instead of Vercel Cron.
# The endpoint itself does all the work (fetch → verify → publish VERIFIED
# only); this workflow is just the clock, so schedule and retries live in one
# reviewable file.

on:
  schedule:
    # 10:00 UTC = 17:00 WIB
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-verification
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger /api/cron/news
        env:
          # Optional repository variable to target a preview deployment.
          BASE_URL: ${{ vars.NEWS_BASE_URL }}
          # Repository secret — the same value as CRON_SECRET on Vercel.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          base="${BASE_URL:-https://kpop-tracker-six.vercel.app}"

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET repository secret is not set — add it under Settings → Secrets and variables → Actions"
            exit 1
          fi

          code="$(curl -sS -o /tmp/news-run.json -w '%{http_code}' \
            --retry 3 --retry-delay 15 --retry-all-errors --max-time 540 \
            -X POST "$base/api/cron/news" \
            -H "Authorization: Bearer $CRON_SECRET")"

          echo "HTTP $code"
          cat /tmp/news-run.json
          echo

          if [ "$code" != "200" ]; then
            echo "::error::news pipeline returned HTTP $code"
            exit 1
          fi

          if command -v jq >/dev/null 2>&1; then
            {
              echo "### News run"
              echo "| field | value |"
              echo "| --- | --- |"
              for key in status discovered verified pending fetch_failed rechecked; do
                echo "| $key | $(jq -r --arg k "$key" '.[$k] // "—"' /tmp/news-run.json) |"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi
